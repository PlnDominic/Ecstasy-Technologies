<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="fonts/local.css">
<style>
:root { --ink:#F5F5F7; --muted:#9A9AAE; --wa:#25D366; --blue:#0A84FF; --warm:#FFC36B; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { overflow:hidden; background:#070915; }
#s { position:relative; overflow:hidden; font-family:'Inter',sans-serif; color:var(--ink);
  background: radial-gradient(ellipse at 50% 0%, #1A1F45 0%, #0B0E24 45%, #05060F 100%); }
.abs { position:absolute; }
canvas { position:absolute; inset:0; }
.brand { font-weight:700; letter-spacing:.18em; font-size:24px; color:rgba(245,245,247,.75); }
.brand i { font-style:normal; color:var(--warm); }
.count { font-weight:600; font-size:24px; color:rgba(245,245,247,.5); letter-spacing:.05em; }
h1 { font-weight:800; letter-spacing:-.045em; line-height:1.02; }
h1 .m { color:var(--muted); }
h1 em { font-style:normal; color:var(--warm); }
.sub { font-weight:500; color:#C9C9D6; letter-spacing:-.015em; line-height:1.3; }
.phone { border-radius:64px; background:#0E1022; padding:16px; box-shadow:0 0 0 2px rgba(255,255,255,.08), 0 40px 120px -20px rgba(80,120,255,.35), 0 30px 80px rgba(0,0,0,.6); }
.screen { border-radius:50px; overflow:hidden; background:#fff; position:relative; width:100%; height:100%; }
.screen img { width:100%; display:block; }
.notch { position:absolute; top:14px; left:50%; transform:translateX(-50%); width:150px; height:38px; border-radius:20px; background:#0E1022; z-index:2; }
.tag { display:inline-flex; align-items:center; gap:14px; font-weight:600; font-size:34px; letter-spacing:-.015em; white-space:nowrap; }
.tag .pip { width:14px; height:14px; border-radius:50%; background:var(--warm); box-shadow:0 0 16px var(--warm); }
.tag span { color:var(--muted); font-weight:500; }
.pill { border-radius:999px; display:flex; align-items:center; justify-content:center; gap:16px; font-weight:700; white-space:nowrap; letter-spacing:-.01em; }
.wa { background:var(--wa); color:#fff; box-shadow:0 0 50px rgba(37,211,102,.45); }
.web { color:#fff; box-shadow:0 0 0 2.5px rgba(143,195,255,.6) inset; background:rgba(143,195,255,.08); font-weight:600; }
.logocard { background:#fff; border-radius:30px; display:flex; align-items:center; justify-content:center; }
.logocard img { mix-blend-mode:multiply; }
.swipe { font-weight:600; font-size:28px; color:rgba(245,245,247,.6); letter-spacing:.02em; }
</style>
</head>
<body>
<div id="s"><canvas id="stars"></canvas></div>
<script>
const Q = new URLSearchParams(location.search);
const FMT = Q.get('fmt') || 'tt';           // tt = 1080x1920 (TikTok), ig = 1080x1350 (Instagram 4:5)
const N = +(Q.get('n') || 1);
const W = 1080, H = FMT === 'tt' ? 1920 : 1350;
const S = document.getElementById('s');
S.style.width = W + 'px'; S.style.height = H + 'px';
document.body.style.width = W + 'px'; document.body.style.height = H + 'px';
const TOTAL = 5;

// static stars
const c = document.getElementById('stars'); c.width = W; c.height = H;
{ let seed = 11; const r = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const g = c.getContext('2d');
  for (let i = 0; i < 160; i++) { g.globalAlpha = 0.15 + r() * 0.6; g.fillStyle = '#fff'; g.beginPath(); g.arc(r() * W, r() * H, 0.6 + r() * 1.5, 0, 6.283); g.fill(); } }

function el(html, style) { const d = document.createElement('div'); d.className = 'abs'; d.innerHTML = html; Object.assign(d.style, style); S.appendChild(d); return d; }
const TOPY = FMT === 'tt' ? 90 : 60;
function chrome() {
  el('ECSTASY TECHNOLOGIES', { left: '70px', top: TOPY + 'px' }).className = 'abs brand';
  const ct = el(`${N} / ${TOTAL}`, { right: '70px', top: TOPY + 'px' }); ct.className = 'abs count';
}

const WA_ICON = '<svg viewBox="0 0 24 24" width="1.1em" height="1.1em"><path fill="#fff" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.2.3-.9.9-.9 2.2s.9 2.5 1 2.7c.1.2 1.8 2.8 4.4 3.9 1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>';
const GLOBE = '<svg viewBox="0 0 24 24" width="1em" height="1em"><path fill="#8FC3FF" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm6.9 6h-3a15.7 15.7 0 0 0-1.4-3.6A8 8 0 0 1 18.9 8zM12 4c.8 1.2 1.5 2.5 1.9 4h-3.8c.4-1.5 1.1-2.8 1.9-4zM4.3 14a8 8 0 0 1 0-4h3.4a16.5 16.5 0 0 0 0 4H4.3zm.8 2h3a15.7 15.7 0 0 0 1.4 3.6A8 8 0 0 1 5.1 16zM8 8H5.1a8 8 0 0 1 4.4-3.6C8.9 5.5 8.4 6.7 8 8zm4 12c-.8-1.2-1.5-2.5-1.9-4h3.8c-.4 1.5-1.1 2.8-1.9 4zm2.3-6H9.7a14.7 14.7 0 0 1 0-4h4.6a14.7 14.7 0 0 1 0 4zm.2 5.6c.6-1.1 1.1-2.3 1.4-3.6h3a8 8 0 0 1-4.4 3.6zM16.3 14a16.5 16.5 0 0 0 0-4h3.4a8 8 0 0 1 0 4h-3.4z"/></svg>';

const PROJ = {
  2: { img: 'assets/m-kings.jpg', h1: 'A hotel that takes<br><span class="m">bookings at 2 AM.</span>', name: 'Kings Towers Hotel', sub: 'Kumasi · booking website', shift: 0 },
  3: { img: 'assets/m-persis.jpg', h1: 'A salon you can<br><span class="m">book in one tap.</span>', name: 'Persis Luxury Beauty World', sub: 'online appointments', shift: 0 },
  4: { img: 'assets/m-gusty.jpg', h1: 'An NGO the world<br><span class="m">can find.</span>', name: 'Gusty Women Foundation', sub: 'NGO website', shift: 0 },
};

if (N === 1) {
  // full-bleed photo of Dominic
  const img = el(`<img src="assets/dom-mirror.jpg" style="width:100%;height:100%;object-fit:cover;object-position:50% ${FMT === 'tt' ? '40%' : '42%'};display:block">`, { left: 0, top: 0, width: W + 'px', height: H + 'px' });
  el('', { left: 0, top: 0, width: W + 'px', height: H + 'px', background: 'linear-gradient(180deg, rgba(5,6,15,.55) 0%, rgba(5,6,15,0) 22%, rgba(5,6,15,0) 48%, rgba(5,6,15,.82) 72%, rgba(5,6,15,.97) 100%)' });
  chrome();
  const fs = FMT === 'tt' ? 104 : 92;
  el(`<h1 style="font-size:${fs}px">Meet the developer<br><span class="m">behind Ecstasy</span><br><span class="m">Technologies<em>.</em></span></h1>`, { left: '70px', bottom: (FMT === 'tt' ? 300 : 190) + 'px', width: '940px' });
  el(`<div class="sub" style="font-size:38px">Dominic Kudom · Founder</div>`, { left: '70px', bottom: (FMT === 'tt' ? 210 : 115) + 'px' });
  el(`<div class="swipe">Swipe to see what I build →</div>`, { left: '70px', bottom: (FMT === 'tt' ? 120 : 50) + 'px' });
} else if (N >= 2 && N <= 4) {
  const p = PROJ[N];
  chrome();
  const fs = FMT === 'tt' ? 88 : 72;
  el(`<h1 style="font-size:${fs}px">${p.h1}</h1>`, { left: '70px', top: (FMT === 'tt' ? 190 : 140) + 'px', width: '940px' });
  // phone
  const ph = FMT === 'tt' ? { w: 640, h: 1180, y: 460 } : { w: 470, h: 860, y: 365 };
  if (FMT === 'ig') { ph.y = 345; }
  const phone = el(`<div class="notch"></div><div class="screen"><img src="${p.img}"></div>`, { left: (W - ph.w) / 2 + 'px', top: ph.y + 'px', width: ph.w + 'px', height: ph.h + 'px' });
  phone.className = 'abs phone';
  if (FMT === 'ig') { phone.style.left = '70px'; }
  const tagStyle = FMT === 'tt'
    ? { left: '70px', top: (ph.y + ph.h + 50) + 'px' }
    : { left: (70 + ph.w + 50) + 'px', top: (ph.y + ph.h - 230) + 'px', width: '420px' };
  const t = el(FMT === 'tt'
    ? `<div class="tag"><div class="pip"></div>${p.name} <span>· ${p.sub}</span></div>`
    : `<div style="font-weight:700;font-size:40px;letter-spacing:-.02em;line-height:1.1">${p.name}</div><div style="color:var(--muted);font-weight:500;font-size:30px;margin-top:12px">${p.sub}</div><div style="margin-top:30px;color:var(--warm);font-weight:600;font-size:28px">Built by Ecstasy Technologies</div>`, tagStyle);
  if (FMT === 'tt') el(`<div class="sub" style="font-size:30px;color:var(--muted)">Built by Ecstasy Technologies</div>`, { left: '70px', top: (ph.y + ph.h + 110) + 'px' });
} else {
  chrome();
  const tt = FMT === 'tt';
  const y0 = tt ? 540 : 210;
  el(`<h1 style="font-size:${tt ? 116 : 96}px;text-align:center">Your business<br><span class="m">could be next<em>.</em></span></h1>`, { left: '60px', top: y0 + 'px', width: '960px' });
  el(`<div class="sub" style="font-size:${tt ? 40 : 34}px;text-align:center">Websites · Mobile apps · Business software</div>`, { left: '60px', top: (y0 + (tt ? 300 : 250)) + 'px', width: '960px' });
  const by = y0 + (tt ? 470 : 390);
  const wa = el(`${WA_ICON}WhatsApp +233 54 285 5399`, { left: '115px', top: by + 'px', width: '850px', height: (tt ? 130 : 116) + 'px', fontSize: (tt ? 46 : 42) + 'px' });
  wa.className = 'abs pill wa';
  const web = el(`${GLOBE}www.ecstasytechnologies.com`, { left: '165px', top: (by + (tt ? 170 : 150)) + 'px', width: '750px', height: (tt ? 104 : 94) + 'px', fontSize: (tt ? 38 : 34) + 'px' });
  web.className = 'abs pill web';
  const lc = el(`<img src="assets/logo.png" style="width:${tt ? 400 : 340}px">`, { left: (W - (tt ? 460 : 400)) / 2 + 'px', top: (by + (tt ? 380 : 320)) + 'px', width: (tt ? 460 : 400) + 'px', height: (tt ? 170 : 150) + 'px' });
  lc.className = 'abs logocard';
}
Promise.all([document.fonts.load('800 40px Inter'), document.fonts.load('500 20px Inter')]).then(() => document.fonts.ready)
  .then(() => Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; }))))
  .then(() => { window.__ready = true; });
</script>
</body>
</html>
