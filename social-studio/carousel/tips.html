<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="fonts/local.css">
<style>
:root { --ink:#1D1D1F; --muted:#86868B; --wa:#25D366; --gold:#B8901E; --warm:#B8901E; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { overflow:hidden; background:#FFFFFF; }
#s { position:relative; overflow:hidden; font-family:'Inter',sans-serif; color:var(--ink);
  background:#FFFFFF; }
.abs { position:absolute; }
canvas { position:absolute; inset:0; }
.brand { font-weight:700; letter-spacing:.18em; font-size:24px; color:#1D1D1F; }
.brand i { font-style:normal; color:var(--warm); }
.count { font-weight:600; font-size:24px; color:#86868B; letter-spacing:.05em; }
h1 { font-weight:800; letter-spacing:-.045em; line-height:1.02; }
h1 .m { color:var(--muted); }
h1 em { font-style:normal; color:var(--warm); }
.sub { font-weight:500; color:#3A3A3C; letter-spacing:-.015em; line-height:1.3; }
.phone { border-radius:64px; background:#1D1D1F; padding:16px; box-shadow:0 50px 100px -30px rgba(0,0,0,.35), 0 0 0 1px rgba(0,0,0,.08); }
.screen { border-radius:50px; overflow:hidden; background:#000; position:relative; width:100%; height:100%; }
.screen img { width:100%; display:block; }
.notch { position:absolute; top:14px; left:50%; transform:translateX(-50%); width:150px; height:38px; border-radius:20px; background:#1D1D1F; z-index:2; }
.win { border-radius:18px; overflow:hidden; background:#000; box-shadow:0 50px 100px -30px rgba(0,0,0,.32), 0 0 0 1px rgba(0,0,0,.08); }
.win .bar { height:46px; background:#F2F2F4; display:flex; align-items:center; gap:9px; padding:0 18px; position:relative; }
.win .bar i { width:13px; height:13px; border-radius:50%; background:#D9D9DE; display:block; }
.win .bar .url { position:absolute; left:50%; transform:translateX(-50%); background:#E8E8ED; border-radius:8px; padding:6px 20px; font-size:18px; color:#9A9AAE; font-weight:500; }
.win img { width:100%; display:block; }
.chip { border-radius:999px; font-weight:800; letter-spacing:-.03em; display:flex; align-items:center; justify-content:center; background:#F5F5F7; color:#1D1D1F; box-shadow:0 12px 30px -10px rgba(0,0,0,.25), 0 0 0 1px rgba(0,0,0,.06); }
.pill { border-radius:999px; display:flex; align-items:center; justify-content:center; gap:16px; font-weight:700; white-space:nowrap; letter-spacing:-.01em; }
.wa { background:var(--wa); color:#fff; box-shadow:0 20px 40px -14px rgba(37,211,102,.6); }
.web { color:#1D1D1F; box-shadow:0 0 0 2.5px #D2D2D7 inset; background:#fff; font-weight:600; }
.swipe { font-weight:600; font-size:30px; color:#86868B; letter-spacing:.01em; }
.cap { font-weight:600; font-size:34px; letter-spacing:-.015em; }
.cap span { color:var(--muted); font-weight:500; }
</style>
</head>
<body>
<div id="s"><canvas id="stars"></canvas></div>
<script>
const Q = new URLSearchParams(location.search);
const DECKS = {
 school: { accent:'#B3231C', total:5, slides:[
  {t:'cover', h:'Want parents<br>to apply<em>?</em>', sub:'3 steps every school website needs', foot:'Seen on Brainy Kings &amp; Queens Montessori, Kumasi', img:'assets/brainy-hero.jpg'},
  {t:'step', n:1, h:'Say it in<br>one line.', img:'assets/brainy-hero.jpg', cap:'A clear promise, and Apply for Admission in reach'},
  {t:'step', n:2, h:'Show every<br>stage.', img:'assets/brainy-s2.jpg', cap:'Pre-School, Primary and Junior High, side by side'},
  {t:'step', n:3, h:'Make applying<br>one tap.', img:'assets/brainy-s3.jpg', cap:'Admissions open, with an Apply Now button'},
  {t:'cta', h:'Save this<br>for later<em>.</em>', sub:'Want a school website like this?'} ]},
 dom: { accent:'#0071E3', total:5, slides:[
  {t:'photo', h:'3 things your<br>business website<br>needs<em>.</em>', sub:'Dominic Kudom · Founder, Ecstasy Technologies', img:'assets/dom-office.jpg'},
  {t:'tip', n:1, h:'Your WhatsApp<br>number, first.', body:'People should not hunt for how to reach you. Put WhatsApp and Call buttons where they see them first.'},
  {t:'tip', n:2, h:'Say what you<br>offer, and how<br>to order.', body:'Show your services and prices, or say clearly how to book or buy. Guessing loses customers.'},
  {t:'tip', n:3, h:'Test it on<br>your phone.', body:'Open your site on your own phone. If it is slow or hard to read, fix that before anything else.'},
  {t:'cta', h:'Tag someone<br>who needs<br>this<em>.</em>', sub:'Need a website? Message me.', img:'assets/dom-bw.jpg'} ]}
};
const D = DECKS[Q.get('c') || 'school'];
document.documentElement.style.setProperty('--warm', D.accent);
const FMT = Q.get('fmt') || 'tt', N = +(Q.get('n') || 1);
const W = 1080, H = FMT === 'tt' ? 1920 : 1350, TT = FMT === 'tt';
const S = document.getElementById('s');
S.style.width = W + 'px'; S.style.height = H + 'px';
document.body.style.width = W + 'px'; document.body.style.height = H + 'px';
document.getElementById('stars').remove();
function el(html, style, cls) { const d = document.createElement('div'); d.className = 'abs ' + (cls || ''); d.innerHTML = html; Object.assign(d.style, style); S.appendChild(d); return d; }
const TOPY = TT ? 90 : 56;
el('ECSTASY TECHNOLOGIES', { left: '70px', top: TOPY + 'px' }, 'brand');
el(`${N} / ${D.total}`, { right: '70px', top: TOPY + 'px' }, 'count');
const WA_ICON = '<svg viewBox="0 0 24 24" width="1.1em" height="1.1em"><path fill="#fff" d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.2-.4.2-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.3-.2.3-.9.9-.9 2.2s.9 2.5 1 2.7c.1.2 1.8 2.8 4.4 3.9 1.6.7 2.3.8 3.1.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>';
const GLOBE = '<svg viewBox="0 0 24 24" width="1em" height="1em"><path fill="#0071E3" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm6.9 6h-3a15.7 15.7 0 0 0-1.4-3.6A8 8 0 0 1 18.9 8zM12 4c.8 1.2 1.5 2.5 1.9 4h-3.8c.4-1.5 1.1-2.8 1.9-4zM4.3 14a8 8 0 0 1 0-4h3.4a16.5 16.5 0 0 0 0 4H4.3zm.8 2h3a15.7 15.7 0 0 0 1.4 3.6A8 8 0 0 1 5.1 16zM8 8H5.1a8 8 0 0 1 4.4-3.6C8.9 5.5 8.4 6.7 8 8zm4 12c-.8-1.2-1.5-2.5-1.9-4h3.8c-.4 1.5-1.1 2.8-1.9 4zm2.3-6H9.7a14.7 14.7 0 0 1 0-4h4.6a14.7 14.7 0 0 1 0 4zm.2 5.6c.6-1.1 1.1-2.3 1.4-3.6h3a8 8 0 0 1-4.4 3.6zM16.3 14a16.5 16.5 0 0 0 0-4h3.4a8 8 0 0 1 0 4h-3.4z"/></svg>';
function phone(img, x, y, w, h) { return el(`<div class="notch"></div><div class="screen"><img src="${img}"></div>`, { left: x + 'px', top: y + 'px', width: w + 'px', height: h + 'px' }, 'phone'); }
const d = D.slides[N - 1];
if (d.t === 'cover') {
  el(`<h1 style="font-size:${TT ? 150 : 124}px;white-space:nowrap">${d.h}</h1>`, { left: '70px', top: (TT ? 200 : 140) + 'px', width: '940px' });
  el(`<div style="font-weight:800;font-size:${TT ? 62 : 46}px;letter-spacing:-.03em;color:var(--warm);line-height:1.1">${d.sub}</div>`, { left: '70px', top: (TT ? 640 : 480) + 'px', width: (TT ? 940 : 460) + 'px' });
  if (TT) phone(d.img, 250, 1000, 600, 1130); else phone(d.img, 560, 480, 430, 810);
  el(`<div class="sub" style="font-size:${TT ? 32 : 28}px;color:var(--muted)">${d.foot}</div>`, TT ? { left: '70px', top: '900px', width: '600px' } : { left: '70px', top: '780px', width: '440px' });
  el(`<div class="swipe">Swipe →</div>`, TT ? { left: '70px', top: '1010px' } : { left: '70px', top: '1000px' });
} else if (d.t === 'photo') {
  el(`<h1 style="font-size:${TT ? 118 : 96}px">${d.h}</h1>`, { left: '70px', top: (TT ? 190 : 130) + 'px', width: '940px' });
  const ph = TT ? { x: 70, y: 720, w: 940, h: 1020 } : { x: 70, y: 470, w: 940, h: 700 };
  el(`<img src="${d.img}" style="width:100%;height:100%;object-fit:cover;object-position:50% 62%;display:block">`, { left: ph.x + 'px', top: ph.y + 'px', width: ph.w + 'px', height: ph.h + 'px', borderRadius: '48px', overflow: 'hidden', boxShadow: '0 50px 100px -30px rgba(0,0,0,.35), 0 0 0 1px rgba(0,0,0,.08)' });
  el(`<div class="cap">${d.sub}</div>`, { left: '70px', top: (ph.y + ph.h + 40) + 'px', width: '940px' });
  el(`<div class="swipe">Swipe →</div>`, { left: '70px', top: (ph.y + ph.h + 110) + 'px' });
} else if (d.t === 'step') {
  el(`<div style="font-weight:800;font-size:${TT ? 40 : 34}px;color:var(--warm);letter-spacing:.04em">STEP ${d.n} OF 3</div>`, { left: '70px', top: (TT ? 170 : 120) + 'px' });
  el(`<h1 style="font-size:${TT ? 92 : 74}px">${d.h}</h1>`, { left: '70px', top: (TT ? 240 : 175) + 'px', width: '940px' });
  if (TT) { phone(d.img, 220, 520, 640, 1210); el(`<div class="cap">${d.cap}</div>`, { left: '70px', top: '1790px', width: '940px' }); }
  else { phone(d.img, 70, 340, 470, 880); el(`<div class="cap" style="font-size:36px;line-height:1.2">${d.cap}</div><div class="sub" style="margin-top:22px;font-size:28px;color:var(--muted)">Brainy Kings &amp; Queens Montessori</div>`, { left: '600px', top: '860px', width: '420px' }); }
} else if (d.t === 'tip') {
  el(`<div style="font-weight:800;font-size:${TT ? 420 : 300}px;letter-spacing:-.06em;color:var(--warm);line-height:1">${d.n}</div>`, { left: '70px', top: (TT ? 190 : 120) + 'px' });
  el(`<h1 style="font-size:${TT ? 112 : 88}px">${d.h}</h1>`, { left: '70px', top: (TT ? 700 : 450) + 'px', width: '940px' });
  el(`<div class="sub" style="font-size:${TT ? 54 : 42}px">${d.body}</div>`, { left: '70px', top: (TT ? 1230 : 880) + 'px', width: '900px' });
} else {
  const y0 = TT ? 330 : 120;
  el(`<h1 style="font-size:${TT ? 124 : 100}px;text-align:center">${d.h}</h1>`, { left: '60px', top: y0 + 'px', width: '960px' });
  let y = y0 + (TT ? 420 : 330);
  if (d.img) { el(`<img src="${d.img}" style="width:100%;height:100%;object-fit:cover;object-position:50% 25%;display:block">`, { left: '390px', top: (TT ? 830 : 520) + 'px', width: '300px', height: '300px', borderRadius: '150px', overflow: 'hidden', boxShadow: '0 30px 60px -20px rgba(0,0,0,.35)' }); y = TT ? 1170 : 860; }
  el(`<div class="sub" style="font-size:${TT ? 40 : 34}px;text-align:center">${d.sub}</div>`, { left: '60px', top: y + 'px', width: '960px' });
  const by = y + (TT ? 100 : 80);
  el(`${WA_ICON}WhatsApp +233 54 285 5399`, { left: '115px', top: by + 'px', width: '850px', height: (TT ? 130 : 116) + 'px', fontSize: (TT ? 46 : 42) + 'px' }, 'pill wa');
  el(`${GLOBE}www.ecstasytechnologies.com`, { left: '165px', top: (by + (TT ? 170 : 150)) + 'px', width: '750px', height: (TT ? 104 : 94) + 'px', fontSize: (TT ? 38 : 34) + 'px' }, 'pill web');
  el(`<div class="sub" style="font-size:${TT ? 30 : 26}px;text-align:center;color:var(--muted)">Built by Ecstasy Technologies</div>`, { left: '60px', top: (by + (TT ? 330 : 290)) + 'px', width: '960px' });
}
Promise.all([document.fonts.load('800 40px Inter'), document.fonts.load('500 20px Inter')]).then(() => document.fonts.ready)
  .then(() => Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; }))))
  .then(() => { window.__ready = true; });
</script>
</body>
</html>
