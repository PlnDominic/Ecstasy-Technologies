<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts/local.css"><style>@font-face{font-family:'Jakarta';font-weight:400;src:url('fonts/plus-jakarta-sans-latin-400-normal.woff2') format('woff2');}
@font-face{font-family:'Jakarta';font-weight:500 700;src:url('fonts/plus-jakarta-sans-latin-600-normal.woff2') format('woff2');}
@font-face{font-family:'Jakarta';font-weight:800;src:url('fonts/plus-jakarta-sans-latin-800-normal.woff2') format('woff2');}
@font-face{font-family:'Play';font-weight:400 500;font-style:normal;src:url('fonts/playfair-display-latin-500-normal.woff2') format('woff2');}
@font-face{font-family:'Play';font-weight:600 800;font-style:normal;src:url('fonts/playfair-display-latin-700-normal.woff2') format('woff2');}
@font-face{font-family:'Play';font-weight:400 800;font-style:italic;src:url('fonts/playfair-display-latin-600-italic.woff2') format('woff2');}
* { margin:0; padding:0; box-sizing:border-box; } html, body { overflow:hidden; }
#stage { position:relative; overflow:hidden; } .abs { position:absolute; left:0; top:0; transform-origin:0 0; }

body, #stage { background:#0B0B0B; }

.serif { font-family:'Play', serif; } .fg { font-family:'Jakarta'; font-weight:700; }
.arch { width:300px; height:1000px; border-radius:150px 150px 0 0; background:#F2EBDD; box-shadow:0 0 0 2px #C9A86A; overflow:hidden; }
.arch img { position:absolute; left:-30px; top:110px; width:360px; mix-blend-mode:multiply; }
.big { width:620px; height:1000px; border-radius:310px 310px 0 0; background:#F2EBDD; box-shadow:0 0 0 2px #C9A86A; overflow:hidden; }
.big img { position:absolute; left:-25px; top:110px; width:670px; mix-blend-mode:multiply; }
.nm { font-size:28px; letter-spacing:.26em; color:#C9A86A; white-space:nowrap; text-transform:uppercase; }
#k { font-size:30px; letter-spacing:.4em; color:#C9A86A; white-space:nowrap; }
#t1 { font-size:132px; font-style:italic; color:#F2EBDD; line-height:1.0; white-space:nowrap; }
#t1 em { color:#C9A86A; }
.step { font-size:72px; font-style:italic; color:#F2EBDD; white-space:nowrap; line-height:1.0; } .step em { color:#C9A86A; font-style:normal; font-family:'Jakarta'; font-weight:700; font-size:30px; letter-spacing:.3em; display:inline-block; width:110px; vertical-align:middle; }
.line { background:#C9A86A; height:2px; }
#eB { font-size:30px; letter-spacing:.34em; color:#C9A86A; white-space:nowrap; }
#eH { font-size:130px; font-style:italic; color:#F2EBDD; line-height:1.04; white-space:nowrap; text-align:center; }
#eW { font-size:50px; color:#F2EBDD; white-space:nowrap; }
#eU { font-size:34px; font-weight:500; color:#9A8F7C; white-space:nowrap; font-family:'Jakarta'; }
#eLogo { width:520px; background:#F2EBDD; border-radius:24px; padding:16px; }
</style></head><body><div id="stage">
<div class="abs fg" id="k">ECSTASY TECHNOLOGIES  ×  MAVE</div><div class="abs serif" id="t1">Still taking<br>orders<br><em>in DMs?</em></div>
<div class="abs arch" id="a0"><img src="assets/mave/ruby-kente-mermaid.png"></div><div class="abs fg nm" id="an0">Browse</div><div class="abs arch" id="a1"><img src="assets/mave/cocoa-kente-gown.png"></div><div class="abs fg nm" id="an1">Turn</div><div class="abs arch" id="a2"><img src="assets/mave/ivory-ombre-drape.png"></div><div class="abs fg nm" id="an2">Order</div>
<div class="abs big" id="big"><img class="bf" src="assets/mave/hf0001.png"><img class="bf" src="assets/mave/hf0010.png"><img class="bf" src="assets/mave/hf0020.png"><img class="bf" src="assets/mave/hf0030.png"><img class="bf" src="assets/mave/hf0040.png"><img class="bf" src="assets/mave/hf0050.png"><img class="bf" src="assets/mave/hf0060.png"></div>
<div class="abs line" id="ln"></div>
<div class="abs serif step" id="s0"><em>01</em>Pick a design.</div><div class="abs serif step" id="s1"><em>02</em>Send your measurements.</div><div class="abs serif step" id="s2"><em>03</em>We stitch it to fit.</div>
<img class="abs" id="eLogo" src="assets/logo.png">
<div class="abs fg" id="eB">WEBSITE BUILT BY</div><div class="abs serif" id="eH">Ecstasy<br>Technologies.</div>
<div class="abs fg" id="eW">WhatsApp +233 54 285 5399</div><div class="abs fg" id="eU">www.ecstasytechnologies.com</div>
</div><script>
const FMT = new URLSearchParams(location.search).get('fmt') || 'v';
const V = FMT === 'v';
const W = V ? 1080 : 1920, H = V ? 1920 : 1080;
const $ = id => document.getElementById(id);
$('stage').style.width = W + 'px'; $('stage').style.height = H + 'px';
document.body.style.width = W + 'px'; document.body.style.height = H + 'px';

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
function spring(t, w = 16, z = 0.55) {
  if (t <= 0) return 0;
  if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t);
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
}
const TYPE = t => spring(t, 18, 0.62);
const POP = t => spring(t, 20, 0.6);
const HEAVY = t => spring(t, 9, 1);
const easeIn = t => { t = clamp(t); return t * t * t; };
const easeOut = t => { t = clamp(t); return 1 - Math.pow(1 - t, 3); };
const easeInOut = t => { t = clamp(t); return t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2; };
function set(el, { x = 0, y = 0, s = 1, r = 0, o = 1 }) {
  el.style.transform = `translate(${x}px,${y}px) rotate(${r}deg) scale(${s})`;
  el.style.opacity = o;
}
function size(el, w, h) { el.style.width = w + 'px'; if (h != null) el.style.height = h + 'px'; }


function vis(t, a, b) { return t >= a - 0.001 && t < b; }
function reveal(el, t, t0, t1, x, y, d = 0.7) { const k = 1 - Math.pow(1 - clamp((t - t0) / d), 4), out = easeIn((t - t1 + 0.35) / 0.35), on = vis(t, t0, t1 + 0.01);
  el.style.transform = `translate(${x}px,${y + (1 - k) * 70 - out * 40}px)`; el.style.clipPath = `inset(${out * 100}% 0 ${(1 - k) * 100}% 0)`; el.style.opacity = on ? 1 : 0; }
const EXPO = t => t <= 0 ? 0 : t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);
function fit(el, maxW) { const fs = parseFloat(getComputedStyle(el).fontSize), w = el.scrollWidth; if (w > maxW) el.style.fontSize = (fs * maxW / w) + 'px'; }

function prep() { fit($('t1'), 940); ['s0','s1','s2','eH'].forEach(id => fit($(id), 940)); fit($('eU'), 980); fit($('eW'), 940); fit($('k'), 940); }
const T = { t1: 0.2, arch: 2.9, big: 8.2, steps: 8.9, end: 12.6, dur: 17.2 };
const EVENTS = [{ t: 0.2, k: 'chord' }, { t: 0.5, k: 'swell' }];
[0, 1, 2].forEach(i => EVENTS.push({ t: T.arch + i * 0.45, k: 'pluck' }));
EVENTS.push({ t: T.big - 0.1, k: 'whoosh' }); [0, 1, 2].forEach(i => EVENTS.push({ t: T.steps + i * 0.9, k: 'chime' }));
EVENTS.push({ t: T.end - 0.1, k: 'whoosh' }, { t: T.end + 0.3, k: 'chord' }, { t: T.end + 1.6, k: 'tick' });
function cx(el) { return (W - el.offsetWidth) / 2; }
function seek(t) {
  reveal($('k'), t, T.t1, T.arch, 90, 640, 0.8); reveal($('t1'), t, T.t1 + 0.3, T.arch, 90, 720, 1.2);
  // three arches rise in staggered
  [0, 1, 2].forEach(i => { const a = T.arch + i * 0.45, k = EXPO((t - a) / 1.2), out = easeInOut((t - T.big + 0.1) / 0.6), on = vis(t, a, T.big + 0.7);
    const el = $('a' + i); el.style.transform = `translate(${60 + i * 330}px,${340 + (1 - k) * 900 + out * 1000}px)`; el.style.opacity = on ? 1 : 0;
    el.querySelector('img').style.transform = `scale(${1 + 0.07 * clamp((t - a) / 4)})`; el.querySelector('img').style.transformOrigin = '50% 30%';
    reveal($('an' + i), t, a + 0.7, T.big, 60 + i * 330 + 150 - $('an' + i).offsetWidth / 2, 1390, 0.7); });
  // single big arch turning
  { const k = EXPO((t - T.big) / 1.2), out = easeInOut((t - T.end + 0.5) / 0.5), n = 7;
    const e = $('big'); e.style.transform = `translate(${(W - 620) / 2}px,${260 + (1 - k) * 800 + out * 900}px)`; e.style.opacity = vis(t, T.big, T.end + 0.6) ? 1 : 0;
    const idx = Math.min(n - 1, Math.floor(clamp((t - T.big - 0.4) / 3.6) * n)); e.querySelectorAll('.bf').forEach((im, j) => im.style.opacity = j === idx ? 1 : 0); }
  { const lk = easeOut((t - T.steps) / 0.7); $('ln').style.width = (200 * lk) + 'px'; set($('ln'), { x: 70, y: 1330, o: vis(t, T.steps, T.end) ? 1 : 0 }); }
  [0, 1, 2].forEach(i => reveal($('s' + i), t, T.steps + 0.1 + i * 0.9, T.end, 70, 1380 + i * 125, 0.9));
  // end
  reveal($('eLogo'), t, T.end, 99, cx($('eLogo')), 270, 0.9); reveal($('eB'), t, T.end + 0.3, 99, cx($('eB')), 650, 0.8); reveal($('eH'), t, T.end + 0.5, 99, cx($('eH')), 740, 1.0);
  reveal($('eW'), t, T.end + 1.3, 99, cx($('eW')), 1230, 0.8); reveal($('eU'), t, T.end + 1.6, 99, cx($('eU')), 1330, 0.8);
}

window.__duration = 17.2;
window.__events = EVENTS;
window.__seek = seek;
Promise.all(['700 40px Jakarta', 'italic 40px Play', '40px Play'].map(f => document.fonts.load(f)))
  .then(() => document.fonts.ready)
  .then(() => Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; }))))
  .then(() => { if (typeof prep === 'function') prep(); seek(0); window.__ready = true; });
</script></body></html>
