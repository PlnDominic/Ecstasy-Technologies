<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts/local.css"><style>@font-face{font-family:'Jakarta';font-weight:400;src:url('fonts/plus-jakarta-sans-latin-400-normal.woff2') format('woff2');}
@font-face{font-family:'Jakarta';font-weight:500 700;src:url('fonts/plus-jakarta-sans-latin-600-normal.woff2') format('woff2');}
@font-face{font-family:'Jakarta';font-weight:800;src:url('fonts/plus-jakarta-sans-latin-800-normal.woff2') format('woff2');}
@font-face{font-family:'Play';font-weight:400 500;font-style:normal;src:url('fonts/playfair-display-latin-500-normal.woff2') format('woff2');}
@font-face{font-family:'Play';font-weight:600 800;font-style:normal;src:url('fonts/playfair-display-latin-700-normal.woff2') format('woff2');}

* { margin:0; padding:0; box-sizing:border-box; } html, body { overflow:hidden; }
#stage { position:relative; overflow:hidden; } .abs { position:absolute; left:0; top:0; transform-origin:0 0; }

body, #stage { background:#FFFFFF; }

.syne { font-family:'Jakarta'; font-weight:800; letter-spacing:-.04em; text-transform:uppercase; line-height:.86; white-space:nowrap; }
.serif { font-family:'Play', serif; } .fg { font-family:'Jakarta'; font-weight:700; }
.gimg { height:1260px; display:block; mix-blend-mode:multiply; }
#hook { color:#0B0B0B; }
.cap1 { font-size:62px; font-style:italic; color:#0B0B0B; white-space:nowrap; }
.cap2 { font-size:34px; letter-spacing:.28em; color:#B08D57; white-space:nowrap; }
#count { font-size:26px; letter-spacing:.34em; color:#0B0B0B; white-space:nowrap; }
.rule { background:#0B0B0B; height:2px; }
#own1 { font-size:150px; font-style:italic; color:#0B0B0B; line-height:1; white-space:nowrap; }
#own2 { font-size:50px; color:#0B0B0B; line-height:1.25; white-space:nowrap; }
#own2 b { color:#B08D57; font-weight:700; }
#eB { font-size:30px; letter-spacing:.32em; color:#B08D57; white-space:nowrap; }

#eW { font-size:52px; color:#0B0B0B; white-space:nowrap; }
#eU { font-size:36px; font-weight:500; color:#6B6B6B; white-space:nowrap; font-family:'Jakarta'; }
#eLogo { width:520px; mix-blend-mode:multiply; }
</style></head><body><div id="stage">
<div class="abs syne" id="h1" style="font-size:200px">Made to</div><div class="abs syne" id="h2" style="font-size:200px">measure.</div><div class="abs syne" id="h3" style="font-size:150px">Sold online?</div>
<div class="abs gimg" id="hg0"><img class="gimg" src="assets/mave/hf0030.png" style="height:1180px"></div>
<div class="abs syne" id="gt0" style="color:#0B0B0B;font-size:360px">PICK</div><div class="abs gimg" id="gg0"><img class="gimg" src="assets/mave/ruby-kente-mermaid.png"></div><div class="abs serif cap1" id="gn0">Browse and turn every design</div><div class="abs fg cap2" id="gp0">STEP 01</div><div class="abs syne" id="gt1" style="color:#B08D57;font-size:360px">SEND</div><div class="abs gimg" id="gg1"><img class="gimg" src="assets/mave/cocoa-kente-gown.png"></div><div class="abs serif cap1" id="gn1">Send measurements and photos</div><div class="abs fg cap2" id="gp1">STEP 02</div><div class="abs syne" id="gt2" style="color:#0B0B0B;font-size:360px">BOOK</div><div class="abs gimg" id="gg2"><img class="gimg" src="assets/mave/ivory-ombre-drape.png"></div><div class="abs serif cap1" id="gn2">Book a fitting</div><div class="abs fg cap2" id="gp2">STEP 03</div>
<div class="abs fg" id="count">01 / 04</div><div class="abs rule" id="cr"></div>
<div class="abs serif" id="own1">Your own<br>design?</div><div class="abs fg" id="own2">Send a <b>photo</b>.<br>Get a quote.</div>
<img class="abs" id="eLogo" src="assets/logo.png">
<div class="abs fg" id="eB">WEBSITE BUILT BY</div><div class="abs serif" id="eH">Ecstasy<br>Technologies.</div>
<div class="abs fg" id="eW">WhatsApp +233 54 285 5399</div><div class="abs fg" id="eU">www.ecstasytechnologies.com</div>
</div><script>
const FMT = new URLSearchParams(location.search).get('fmt') || 'v';
const V = FMT === 'v';
const W = V ? 1080 : 1920, H = V ? 1920 : 1080;
const $ = id => document.getElementById(id);
$('stage').style.width = W + 'px'; $('stage').style.height = H + 'px';
document.body.style.width = W + 'px'; document.body.style.height = H + 'px';

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
function spring(t, w = 16, z = 0.55) {
  if (t <= 0) return 0;
  if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t);
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
}
const TYPE = t => spring(t, 18, 0.62);
const POP = t => spring(t, 20, 0.6);
const HEAVY = t => spring(t, 9, 1);
const easeIn = t => { t = clamp(t); return t * t * t; };
const easeOut = t => { t = clamp(t); return 1 - Math.pow(1 - t, 3); };
const easeInOut = t => { t = clamp(t); return t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2; };
function set(el, { x = 0, y = 0, s = 1, r = 0, o = 1 }) {
  el.style.transform = `translate(${x}px,${y}px) rotate(${r}deg) scale(${s})`;
  el.style.opacity = o;
}
function size(el, w, h) { el.style.width = w + 'px'; if (h != null) el.style.height = h + 'px'; }


function vis(t, a, b) { return t >= a - 0.001 && t < b; }
function reveal(el, t, t0, t1, x, y, d = 0.7) { const k = 1 - Math.pow(1 - clamp((t - t0) / d), 4), out = easeIn((t - t1 + 0.35) / 0.35), on = vis(t, t0, t1 + 0.01);
  el.style.transform = `translate(${x}px,${y + (1 - k) * 70 - out * 40}px)`; el.style.clipPath = `inset(${out * 100}% 0 ${(1 - k) * 100}% 0)`; el.style.opacity = on ? 1 : 0; }
const EXPO = t => t <= 0 ? 0 : t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);
function fit(el, maxW) { const fs = parseFloat(getComputedStyle(el).fontSize), w = el.scrollWidth; if (w > maxW) el.style.fontSize = (fs * maxW / w) + 'px'; }

const G = [["PICK", "Browse and turn every design", "STEP 01"], ["SEND", "Send measurements and photos", "STEP 02"], ["BOOK", "Book a fitting", "STEP 03"]];
function prep() { ['gt0','gt1','gt2'].forEach(id => fit($(id), 1010)); fit($('h2'), 1000); fit($('h1'), 1000); fit($('h3'), 1000); fit($('own1'), 940); fit($('own2'), 940); fit($('eH'), 940); fit($('eU'), 980); fit($('eW'), 940); }
const T = { hook: 0.2, b: [3.4, 7.0, 10.6], bl: 3.6, own: 14.2, end: 16.4, dur: 20.0 };
const BT = [T.b[0], T.b[1], T.b[2], T.own];
const EVENTS = [{ t: 0.2, k: 'swell' }, { t: 1.0, k: 'chord' }];
BT.slice(0, 3).forEach(t => EVENTS.push({ t: t - 0.1, k: 'whoosh' }, { t: t + 0.4, k: 'pluck' }));
EVENTS.push({ t: T.own - 0.1, k: 'whoosh' }, { t: T.own + 0.5, k: 'click' }, { t: T.end - 0.1, k: 'whoosh' }, { t: T.end + 0.3, k: 'chord' }, { t: T.end + 1.6, k: 'tick' });
function cx(el) { return (W - el.offsetWidth) / 2; }
function seek(t) {
  // hook, three stacked words
  reveal($('h1'), t, T.hook, T.b[0], 70, 130, 0.9); reveal($('h2'), t, T.hook + 0.18, T.b[0], 74, 380, 0.9); reveal($('h3'), t, T.hook + 0.36, T.b[0], 70, 560, 0.9);
  { const k = EXPO((t - 1.3) / 1.3), out = easeInOut((t - T.b[0] + 0.5) / 0.5), z = 1 + 0.04 * clamp((t - 1.3) / 2);
    const g = $('hg0'); g.style.transform = `translate(${(W - 760) / 2}px,${760 + (1 - k) * 160 - out * 200}px) scale(${z * lerp(1.08, 1, k)})`; g.style.clipPath = `inset(${(1 - k) * 100}% 0 ${out * 100}% 0)`; g.style.opacity = vis(t, 1.3, T.b[0] + 0.6) ? 1 : 0; g.style.transformOrigin = '50% 100%'; }
  // gowns with giant type behind them
  for (let k = 0; k < 3; k++) {
    const a = BT[k], b = BT[k + 1], on = vis(t, a, b + 0.7), kin = EXPO((t - a) / 1.1), out = easeInOut((t - b + 0.1) / 0.6);
    const gt = $('gt' + k), gg = $('gg' + k), w = gg.offsetWidth || 780;
    const drift = lerp(90, -120, clamp((t - a) / (b - a)));
    gt.style.transform = `translate(${(W - gt.offsetWidth) / 2 + drift}px,${300 + (1 - kin) * 60}px)`; gt.style.opacity = on ? clamp((t - a) / 0.4) * (1 - out) : 0;
    const z = 1 + 0.05 * clamp((t - a) / (b - a));
    gg.style.transform = `translate(${(W - 781) / 2}px,${300 + (1 - kin) * 200 - out * 200}px) scale(${z * lerp(1.1, 1, kin)})`; gg.style.transformOrigin = '50% 100%';
    gg.style.clipPath = `inset(${(1 - kin) * 100}% 0 ${out * 100}% 0)`; gg.style.opacity = on ? 1 : 0;
    reveal($('gn' + k), t, a + 0.7, b, 70, 1660, 0.8); reveal($('gp' + k), t, a + 0.95, b, 72, 1740, 0.8);
  }
  { const on = t >= T.b[0] && t < T.own + 0.2; const n = t < T.b[1] ? 1 : t < T.b[2] ? 2 : 3; $('count').textContent = '0' + n + ' / 04';
    reveal($('count'), t, T.b[0] + 0.1, T.own, 70, 70, 0.6); $('cr').style.width = (940 * easeOut((t - T.b[0]) / 0.8)) + 'px'; set($('cr'), { x: 70, y: 124, o: on ? 1 : 0 }); }
  // your own design
  reveal($('own1'), t, T.own, T.end, 70, 420, 1.0); reveal($('own2'), t, T.own + 0.55, T.end, 76, 880, 0.9);
  // end
  reveal($('eLogo'), t, T.end, 99, cx($('eLogo')), 250, 0.9);
  reveal($('eB'), t, T.end + 0.3, 99, cx($('eB')), 640, 0.8); reveal($('eH'), t, T.end + 0.5, 99, cx($('eH')), 720, 1.0);
  reveal($('eW'), t, T.end + 1.3, 99, cx($('eW')), 1220, 0.8); reveal($('eU'), t, T.end + 1.6, 99, cx($('eU')), 1320, 0.8);
}

window.__duration = 20;
window.__events = EVENTS;
window.__seek = seek;
Promise.all(['800 40px Jakarta', '700 40px Jakarta', 'italic 40px Play'].map(f => document.fonts.load(f)))
  .then(() => document.fonts.ready)
  .then(() => Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; }))))
  .then(() => { if (typeof prep === 'function') prep(); seek(0); window.__ready = true; });
</script></body></html>
