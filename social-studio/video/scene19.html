<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="fonts/local.css"><style>@font-face{font-family:'Jakarta';font-weight:400;src:url('fonts/plus-jakarta-sans-latin-400-normal.woff2') format('woff2');}
@font-face{font-family:'Jakarta';font-weight:500 700;src:url('fonts/plus-jakarta-sans-latin-600-normal.woff2') format('woff2');}
@font-face{font-family:'Jakarta';font-weight:800;src:url('fonts/plus-jakarta-sans-latin-800-normal.woff2') format('woff2');}
@font-face{font-family:'Play';font-weight:400 500;font-style:normal;src:url('fonts/playfair-display-latin-500-normal.woff2') format('woff2');}
@font-face{font-family:'Play';font-weight:600 800;font-style:normal;src:url('fonts/playfair-display-latin-700-normal.woff2') format('woff2');}
@font-face{font-family:'Play';font-weight:400 800;font-style:italic;src:url('fonts/playfair-display-latin-600-italic.woff2') format('woff2');}
* { margin:0; padding:0; box-sizing:border-box; } html, body { overflow:hidden; }
#stage { position:relative; overflow:hidden; } .abs { position:absolute; left:0; top:0; transform-origin:0 0; }

body, #stage { background:#07142E; }

#tag { font-family:'Jakarta'; font-weight:700; font-size:28px; letter-spacing:.36em; color:#4DA3FF; white-space:nowrap; }
#hook { font-family:'Jakarta'; font-weight:800; font-size:104px; line-height:1.0; letter-spacing:-.04em; color:#F2F7FF; white-space:nowrap; }
#hook em { font-style:normal; color:#4DA3FF; }
#phone { width:580px; height:1180px; border-radius:76px; background:#fff; overflow:hidden; box-shadow:0 0 0 10px #030A1A, 0 0 0 12px #2C4C8C; }
#phone img { position:absolute; left:0; top:62px; width:580px; }
#isl { width:160px; height:46px; border-radius:23px; background:#030A1A; left:210px; top:22px; }
#cap { background:#4DA3FF; color:#04102A; border-radius:999px; font-family:'Jakarta'; font-weight:800; font-size:56px; letter-spacing:-.02em; padding:26px 58px; white-space:nowrap; }
#eB { font-family:'Jakarta'; font-weight:700; font-size:30px; letter-spacing:.34em; color:#4DA3FF; white-space:nowrap; }
#eH { font-family:'Jakarta'; font-weight:800; font-size:128px; line-height:1.0; letter-spacing:-.045em; color:#F2F7FF; white-space:nowrap; text-align:center; }
#eH em { font-style:normal; color:#4DA3FF; }
#eC { font-family:'Jakarta'; font-weight:600; font-size:50px; color:#F2F7FF; white-space:nowrap; }
#eW { background:#4DA3FF; color:#04102A; border-radius:999px; font-family:'Jakarta'; font-weight:800; font-size:50px; padding:28px 54px; white-space:nowrap; }
#eU { font-family:'Jakarta'; font-weight:500; font-size:36px; color:#9DB6DE; white-space:nowrap; }
#eLogo { width:520px; background:#FFFFFF; border-radius:24px; padding:16px; }
</style></head><body><div id="stage">
<div class="abs" id="tag">ECSTASY TECHNOLOGIES</div>
<div class="abs" id="hook">Can patients<br>book your clinic<br><em>in one tap?</em></div>
<div class="abs" id="phone"><img id="pimg" src="assets/gw/long.jpg"><div class="abs" id="isl"></div></div>
<div class="abs" id="cap">x</div>
<img class="abs" id="eLogo" src="assets/logo.png">
<div class="abs" id="eB">WEBSITE BUILT BY</div><div class="abs" id="eH">Ecstasy<br>Technologies<em>.</em></div>
<div class="abs" id="eC">for GloWhite Dental Clinic</div>
<div class="abs" id="eW">WhatsApp +233 54 285 5399</div><div class="abs" id="eU">www.ecstasytechnologies.com</div>
</div><script>
const FMT = new URLSearchParams(location.search).get('fmt') || 'v';
const V = FMT === 'v';
const W = V ? 1080 : 1920, H = V ? 1920 : 1080;
const $ = id => document.getElementById(id);
$('stage').style.width = W + 'px'; $('stage').style.height = H + 'px';
document.body.style.width = W + 'px'; document.body.style.height = H + 'px';

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, k) => a + (b - a) * k;
function spring(t, w = 16, z = 0.55) {
  if (t <= 0) return 0;
  if (z >= 1) return 1 - Math.exp(-w * t) * (1 + w * t);
  const wd = w * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w * t) * (Math.cos(wd * t) + (z * w / wd) * Math.sin(wd * t));
}
const TYPE = t => spring(t, 18, 0.62);
const POP = t => spring(t, 20, 0.6);
const HEAVY = t => spring(t, 9, 1);
const easeIn = t => { t = clamp(t); return t * t * t; };
const easeOut = t => { t = clamp(t); return 1 - Math.pow(1 - t, 3); };
const easeInOut = t => { t = clamp(t); return t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2; };
function set(el, { x = 0, y = 0, s = 1, r = 0, o = 1 }) {
  el.style.transform = `translate(${x}px,${y}px) rotate(${r}deg) scale(${s})`;
  el.style.opacity = o;
}
function size(el, w, h) { el.style.width = w + 'px'; if (h != null) el.style.height = h + 'px'; }


function vis(t, a, b) { return t >= a - 0.001 && t < b; }
function reveal(el, t, t0, t1, x, y, d = 0.7) { const k = 1 - Math.pow(1 - clamp((t - t0) / d), 4), out = easeIn((t - t1 + 0.35) / 0.35), on = vis(t, t0, t1 + 0.01);
  el.style.transform = `translate(${x}px,${y + (1 - k) * 70 - out * 40}px)`; el.style.clipPath = `inset(${out * 100}% 0 ${(1 - k) * 100}% 0)`; el.style.opacity = on ? 1 : 0; }
const EXPO = t => t <= 0 ? 0 : t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);
function fit(el, maxW) { const fs = parseFloat(getComputedStyle(el).fontSize), w = el.scrollWidth; if (w > maxW) el.style.fontSize = (fs * maxW / w) + 'px'; }

function prep() { fit($('hook'), 940); fit($('eH'), 940); fit($('eC'), 940); fit($('eW'), 940); fit($('eU'), 940); }
const T = {"hook": 0.2, "phone": 3.2, "c1": 3.9, "c2": 8.8, "c3": 11.0, "end": 14.8, "dur": 22.8};
const K = 580 / 390;
const SC = [0, 1050, 1500, 1900];
const CAPS = ["Every service, laid out", "A button on each one", "Book, or ask about braces"].map((c, i) => [c, [T.c1, T.c2, T.c3][i], [T.c2, T.c3, T.end - 0.2][i]]);
const EVENTS = [{ t: 0.2, k: 'swell' }, { t: 0.5, k: 'pluck' }, { t: T.phone - 0.1, k: 'whoosh' }, { t: T.phone + 0.2, k: 'slam' },
  { t: T.c1 + 0.5, k: 'whoosh' }, { t: T.c1, k: 'pluck' }, { t: T.c2, k: 'chime' }, { t: T.c2 + 0.6, k: 'click' }, { t: T.c3 - 0.4, k: 'whoosh' }, { t: T.c3, k: 'pluck' },
  { t: T.end - 0.1, k: 'whoosh' }, { t: T.end + 0.3, k: 'chord' }, { t: T.end + 1.6, k: 'tick' }, { t: T.end + 3.0, k: 'tick' }];
function cx(el) { return (W - el.offsetWidth) / 2; }
function scrollAt(t) {
  const e = (a, b, p, q) => lerp(p, q, easeInOut((t - a) / (b - a)));
  const a1 = T.c1 + 0.5, a2 = T.c2 - 0.3, a3 = T.c3 - 0.4;
  if (t < a1) return SC[0];
  if (t < a1 + 1.7) return e(a1, a1 + 1.7, SC[0], SC[1]);
  if (t < a2) return SC[1];
  if (t < a2 + 1.6) return e(a2, a2 + 1.6, SC[1], SC[2]);
  if (t < a3) return SC[2];
  if (t < a3 + 1.4) return e(a3, a3 + 1.4, SC[2], SC[3]);
  return SC[3];
}
function seek(t) {
  reveal($('tag'), t, T.hook, T.end, 90, 120, 0.8);
  reveal($('hook'), t, T.hook + 0.2, T.phone, 90, 560, 1.0);
  {
    const pk = EXPO((t - T.phone) / 1.2), out = easeInOut((t - T.end + 0.5) / 0.5), S = scrollAt(t);
    $('phone').style.transform = `translate(250px,${540 + (1 - pk) * 140 + out * 1300}px) perspective(2000px) rotateY(${(1 - pk) * -36}deg) rotateX(${(1 - pk) * 10}deg) scale(${lerp(0.86, 1, pk)})`;
    $('phone').style.transformOrigin = '50% 50%'; $('phone').style.opacity = vis(t, T.phone, T.end + 0.6) ? clamp((t - T.phone) / .25) : 0;
    $('pimg').style.transform = `translateY(${-S * K}px)`;
  }
  CAPS.forEach(([txt, a, b], i) => { const el = $('cap'); if (t >= a - 0.01 && t < b) { el.textContent = txt; fit(el, 940); reveal(el, t, a, b, (W - el.offsetWidth) / 2, 1770, 0.7); } });
  if (t < CAPS[0][1] || t >= CAPS[2][2]) $('cap').style.opacity = 0;
  const E = T.end;
  reveal($('eLogo'), t, E, 99, cx($('eLogo')), 230, 0.9);
  reveal($('eB'), t, E + 0.3, 99, cx($('eB')), 600, 0.8); reveal($('eH'), t, E + 0.5, 99, cx($('eH')), 670, 1.0);
  reveal($('eC'), t, E + 1.2, 99, cx($('eC')), 1010, 0.8);
  reveal($('eW'), t, E + 1.8, 99, cx($('eW')), 1180, 0.8); reveal($('eU'), t, E + 2.1, 99, cx($('eU')), 1310, 0.8);
}

window.__duration = 22.8;
window.__events = EVENTS;
window.__seek = seek;
Promise.all(['800 40px Jakarta', '700 40px Jakarta', '600 40px Jakarta', '500 40px Jakarta'].map(f => document.fonts.load(f)))
  .then(() => document.fonts.ready)
  .then(() => Promise.all([...document.images].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; }))))
  .then(() => { if (typeof prep === 'function') prep(); seek(0); window.__ready = true; });
</script></body></html>
